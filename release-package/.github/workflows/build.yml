name: Build Commands

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Show Flutter environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Materialize project
        run: |
          chmod +x tool/bootstrap.sh
          ./tool/bootstrap.sh

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Build ARM 32-bit and 64-bit APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Verify ARM APKs
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/app/outputs/flutter-apk"
          ARM32_APK="$OUT/app-armeabi-v7a-release.apk"
          ARM64_APK="$OUT/app-arm64-v8a-release.apk"
          test -s "$ARM32_APK"
          test -s "$ARM64_APK"

          verify_apk() {
            local apk="$1"
            local expected_abi="$2"
            local listing="$RUNNER_TEMP/apk-list-${expected_abi}.txt"

            unzip -l "$apk" > "$listing"
            if ! grep -Fq "lib/${expected_abi}/" "$listing"; then
              echo "Expected native libraries for ${expected_abi} were not found in ${apk}."
              exit 1
            fi

            if grep -E 'lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/' "$listing" | grep -Fv "lib/${expected_abi}/"; then
              echo "Unexpected mixed-ABI native libraries found in ${apk}."
              exit 1
            fi

            if unzip -Z1 "$apk" | grep -F 'rish_shizuku.dex'; then
              echo "Forbidden rish_shizuku.dex found in ${apk}."
              exit 1
            fi

            if unzip -Z1 "$apk" | grep -Ei '(^|/)(rish|librish)(_|\.|/)'; then
              echo "Forbidden rish execution layer artifact found in ${apk}."
              exit 1
            fi

            if command -v aapt >/dev/null 2>&1; then
              aapt dump badging "$apk" | sed -n '1,5p'
            fi
          }

          verify_apk "$ARM32_APK" "armeabi-v7a"
          verify_apk "$ARM64_APK" "arm64-v8a"
          sha256sum "$ARM32_APK" "$ARM64_APK" | tee apk.sha256

      - name: Package full Flutter project
        run: |
          rm -rf release-package
          mkdir -p release-package
          rsync -a --exclude='.git/' --exclude='build/' --exclude='.dart_tool/' ./ release-package/
          (cd release-package && zip -qr ../commands-flutter-project.zip .)

      - name: Upload armeabi-v7a 32-bit APK
        uses: actions/upload-artifact@v7
        with:
          name: commands-armeabi-v7a-32bit-apk
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v7
        with:
          name: commands-arm64-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload full Flutter project
        uses: actions/upload-artifact@v7
        with:
          name: commands-flutter-project
          path: commands-flutter-project.zip
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated Flutter project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: materialize Flutter project [skip ci]"
          git push origin HEAD:main
